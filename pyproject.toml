[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urdu-document-ocr"
version = "0.1.0"
description = "Foundation for a reproducible Urdu document OCR system with typed document, vision, recognition, training, and evaluation contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["ا"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
