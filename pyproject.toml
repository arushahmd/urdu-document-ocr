[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urdu-document-ocr"
version = "0.1.0"
description = "Foundation for a reproducible Urdu document OCR system with typed document, vision, recognition, training, and evaluation contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "freetype-py>=2.5,<3",
    "numpy>=1.26,<2.4",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=11,<13",
    "pypdfium2>=5,<6",
    "uharfbuzz>=0.56,<0.57",
]

[project.optional-dependencies]
ml = [
    "torch>=2.14,<2.15",
]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urdu_document_ocr = ["assets/fonts/noto-nastaliq-urdu/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["ا", "۔"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
