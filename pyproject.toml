[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urdu-document-ocr"
version = "0.1.0"
description = "Reproducible Urdu document OCR with vision, CRNN training, inference, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "freetype-py>=2.5,<3",
    "numpy>=1.26,<2.4",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=11,<13",
    "pypdfium2>=5,<6",
    "uharfbuzz>=0.56,<0.57",
]

[project.optional-dependencies]
ml = [
    "safetensors>=0.8,<0.9",
    "torch>=2.14,<2.15",
]
api = [
    "fastapi>=0.141,<0.142",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.52,<0.53",
]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<0.17",
]

[project.scripts]
urdu-ocr = "urdu_document_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urdu_document_ocr = ["assets/fonts/noto-nastaliq-urdu/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["ا", "۔"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
